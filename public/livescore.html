<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVL LiveScore Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00e5ff;
            --neon-gold: #f59e0b;
            --dark-bg: #050505;
            --card-bg: rgba(20, 24, 33, 0.85);
            --card-border: rgba(245, 158, 11, 0.3);
            --text-light: #ffffff;
        }

        body { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Rajdhani', sans-serif; 
            width: 1920px; height: 1080px;
            background-color: #03050a;
            background-image: radial-gradient(circle at 50% 50%, #1f1604 0%, #03050a 80%);
            display: flex; flex-direction: column;
            box-sizing: border-box; padding: 40px 60px;
        }

        /* ARKA PLAN SİBERPUNK IZGARA */
        body::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background-image: linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* ÜST BAŞLIK ALANI */
        .header {
            text-align: center; margin-bottom: 25px;
            animation: fadeInDown 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .title {
            font-size: 50px; font-weight: 900; text-transform: uppercase; 
            letter-spacing: 4px; color: white; margin: 0; line-height: 1;
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .title .brand { color: var(--neon-gold); text-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
        
        .subtitle {
            font-size: 22px; color: #00e5ff; letter-spacing: 12px; 
            margin-top: 5px; font-weight: 700; text-shadow: 0 0 10px rgba(0,229,255,0.4);
        }

        /* ANA YERLEŞİM (SOL LOGOLAR - ORTA TABLO - SAĞ LOGOLAR) */
        .main-layout {
            display: flex; flex-direction: row; justify-content: space-between; align-items: stretch;
            flex-grow: 1; gap: 40px;
        }

        /* SAĞ VE SOL KANATTAKİ LOGO VİTRİNLERİ */
        .side-col {
            display: flex; flex-direction: column; justify-content: space-between;
            width: 170px;
        }

        .logo-box {
            position: relative; width: 100%; height: 86px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            border: 2px solid rgba(0, 229, 255, 0.3); border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.05), 0 5px 15px rgba(0,0,0,0.8);
            opacity: 0; transform: scale(0.8);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            padding-top: 5px; box-sizing: border-box;
        }

        .logo-box::before {
            content: ''; position: absolute; top: -2px; left: -2px; width: 15px; height: 15px;
            border-top: 3px solid var(--neon-cyan); border-left: 3px solid var(--neon-cyan); border-radius: 12px 0 0 0;
        }
        .logo-box::after {
            content: ''; position: absolute; bottom: -2px; right: -2px; width: 15px; height: 15px;
            border-bottom: 3px solid var(--neon-cyan); border-right: 3px solid var(--neon-cyan); border-radius: 0 0 12px 0;
        }

        .logo-box img {
            max-width: 90%; height: 42px; object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.4));
            margin-bottom: 2px;
        }

        .logo-team-name {
            font-size: 13px; font-weight: 800; color: #fff;
            text-transform: uppercase; white-space: nowrap; 
            overflow: hidden; text-overflow: ellipsis; max-width: 90%;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); letter-spacing: 0.5px;
        }

        .logo-rank {
            position: absolute; top: -12px; left: -10px;
            background: var(--neon-gold); color: #000;
            font-weight: 900; font-size: 14px; padding: 2px 10px;
            border-radius: 6px; box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            letter-spacing: 1px; z-index: 10;
        }

        /* ORTADAKİ DEV TABLO KUTUSU */
        .center-col {
            flex-grow: 1;
            display: flex; flex-direction: column;
            background: rgba(8, 10, 15, 0.95);
            border: 2px solid rgba(245,158,11,0.5);
            border-radius: 16px; padding: 20px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(245, 158, 11, 0.15);
            backdrop-filter: blur(15px);
        }

        /* SÜTUN BAŞLIKLARI */
        .col-header {
            display: grid; grid-template-columns: 80px 1fr 100px 100px 100px 120px; 
            padding: 0 15px; margin-bottom: 15px; font-weight: 900; font-size: 18px; 
            color: #94a3b8; letter-spacing: 2px; text-transform: uppercase;
        }
        .col-header div { text-align: center; }
        .col-header .th-name { text-align: left; padding-left: 10px; }

        /* TABLO SATIRLARI */
        .rows-wrapper {
            flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;
        }

        .row {
            display: grid; grid-template-columns: 80px 1fr 100px 100px 100px 120px; 
            align-items: center; background: var(--card-bg); 
            border: 1px solid var(--card-border); border-radius: 10px; 
            height: 43px; padding: 0 15px; font-size: 22px; font-weight: 800; 
            color: var(--text-light); box-sizing: border-box;
            opacity: 0; transform: translateY(20px);
            animation: slideUp 0.4s ease-out forwards;
        }

        .row.empty { background: transparent; border-color: transparent; }

        .row div { display: flex; align-items: center; justify-content: center; height: 100%; margin-top: -2px; }

        .rank { font-weight: 900; font-size: 24px; }
        
        .team-info { justify-content: flex-start !important; padding-left: 10px; text-transform: uppercase; overflow: hidden; }
        .team-logo { width: 28px; height: 28px; object-fit: contain; margin-right: 12px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
        .team-logo-empty { width: 28px; height: 28px; margin-right: 12px; }
        .team-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; margin-top: 3px; letter-spacing: 1px;}

        .stat-wwcd { color: #a1a1aa; }
        .stat-place { color: var(--neon-cyan); font-weight: 900; }
        .stat-kills { color: #f87171; font-weight: 900; }
        .stat-total { color: var(--neon-gold); font-weight: 900; font-size: 26px; }

        /* ANİMASYONLAR */
        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="header">
        <h1 class="title"><span class="brand">NVL ORGANIZATION</span> — OVERALL STANDINGS</h1>
        <div class="subtitle" id="match-name">MATCH RESULTS</div>
    </div>

    <div class="main-layout">
        <!-- SOL KANAT (1-9 LOGOLAR) -->
        <div class="side-col" id="col-left"></div>

        <!-- ORTA KANAT (LIVESCORE TABLOSU) -->
        <div class="center-col">
            <div class="col-header">
                <div>RANK</div><div class="th-name">TEAM NAME</div><div>WWCD</div><div>PLACE</div><div>KILLS</div><div>TOTAL</div>
            </div>
            <div class="rows-wrapper" id="col-center"></div>
        </div>

        <!-- SAĞ KANAT (10-18 LOGOLAR) -->
        <div class="side-col" id="col-right"></div>
    </div>

    <script>
        const socket = window.io();

        let globalLeaderboard = [];
        let globalLogos = {};
        let globalDefaultLogo = "";

        function renderScoreboard() {
            const leftContainer = document.getElementById('col-left');
            const rightContainer = document.getElementById('col-right');
            const centerContainer = document.getElementById('col-center');
            
            leftContainer.innerHTML = '';
            rightContainer.innerHTML = '';
            centerContainer.innerHTML = '';

            let displayTeams = [...globalLeaderboard].slice(0, 18);
            while(displayTeams.length < 18) {
                displayTeams.push({ teamName: "", kills: "", score: "", wins: "", placeScore: "" });
            }

            // 1. SOL KANAT LOGOLARI VE İSİMLER (1-9)
            displayTeams.slice(0, 9).forEach((t, i) => {
                let rankNum = i + 1;
                let name = t.teamName || "";
                let logoSrc = globalLogos[name] || globalDefaultLogo;
                let animDelay = i * 0.1;
                
                let content = (name && logoSrc) 
                    ? `<img src="${logoSrc}">` 
                    : `<div style="height:42px; display:flex; align-items:center; justify-content:center; color:#555; font-weight:bold; font-size:12px;">LOGO</div>`;

                if(name) {
                    leftContainer.innerHTML += `
                    <div class="logo-box" style="animation-delay: ${animDelay}s;">
                        <div class="logo-rank">#${rankNum}</div>
                        ${content}
                        <div class="logo-team-name">${name}</div>
                    </div>`;
                } else {
                    leftContainer.innerHTML += `<div style="height: 86px;"></div>`; 
                }
            });

            // 2. SAĞ KANAT LOGOLARI VE İSİMLER (10-18)
            displayTeams.slice(9, 18).forEach((t, i) => {
                let rankNum = i + 10;
                let name = t.teamName || "";
                let logoSrc = globalLogos[name] || globalDefaultLogo;
                let animDelay = (i * 0.1) + 0.3;
                
                let content = (name && logoSrc) 
                    ? `<img src="${logoSrc}">` 
                    : `<div style="height:42px; display:flex; align-items:center; justify-content:center; color:#555; font-weight:bold; font-size:12px;">LOGO</div>`;

                if(name) {
                    rightContainer.innerHTML += `
                    <div class="logo-box" style="animation-delay: ${animDelay}s;">
                        <div class="logo-rank">#${rankNum}</div>
                        ${content}
                        <div class="logo-team-name">${name}</div>
                    </div>`;
                } else {
                    rightContainer.innerHTML += `<div style="height: 86px;"></div>`;
                }
            });

            // 3. ORTA TABLO (TAM 18 SATIR)
            displayTeams.forEach((t, i) => {
                let r = i + 1;
                let name = t.teamName || "";
                let logoSrc = globalLogos[name] || globalDefaultLogo;
                
                let logoHTML = name && logoSrc 
                    ? `<img src="${logoSrc}" class="team-logo">` 
                    : `<div class="team-logo-empty"></div>`;
                
                let rankColor = r === 1 ? '#facc15' : (r === 2 ? '#cbd5e1' : (r === 3 ? '#b45309' : '#ffffff'));
                let animDelay = i * 0.05;

                if (!name) {
                    centerContainer.innerHTML += `<div class="row empty"></div>`;
                } else {
                    centerContainer.innerHTML += `
                    <div class="row" style="animation-delay: ${animDelay}s;">
                        <div class="rank" style="color: ${rankColor}">#${r}</div>
                        <div class="team-info">${logoHTML}<span class="team-name">${name}</span></div>
                        <div class="stat-wwcd">${t.wins || 0}</div>
                        <div class="stat-place">${t.placeScore || 0}</div>
                        <div class="stat-kills">${t.kills || 0}</div>
                        <div class="stat-total">${t.score || 0}</div>
                    </div>`;
                }
            });
        }

        socket.on('liveUpdate', (data) => {
            if (data.settings && data.settings.currentMatch) {
                document.getElementById('match-name').innerText = data.settings.currentMatch;
            }
            if (data.leaderboard) globalLeaderboard = data.leaderboard;
            if (data.logos) globalLogos = data.logos;
            if (data.defaultLogo !== undefined) globalDefaultLogo = data.defaultLogo;
            renderScoreboard();
        });

        socket.on('logoUpdate', (data) => {
            if (data.logos) globalLogos = data.logos;
            renderScoreboard();
        });

        socket.on('defaultLogoUpdate', (data) => {
            if (data.defaultLogo !== undefined) globalDefaultLogo = data.defaultLogo;
            renderScoreboard();
        });

        fetch('/api/data').then(res => res.json()).then(data => {
            if (data.settings && data.settings.currentMatch) {
                document.getElementById('match-name').innerText = data.settings.currentMatch;
            }
            if (data.leaderboard) globalLeaderboard = data.leaderboard;
            if (data.logos) globalLogos = data.logos;
            if (data.defaultLogo) globalDefaultLogo = data.defaultLogo;
            renderScoreboard();
        });
    </script>
</body>
</html>
