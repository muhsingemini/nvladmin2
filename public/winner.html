<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVL Winner Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: transparent; 
            font-family: 'Rajdhani', sans-serif; 
            width: 1920px; height: 1080px;
        }

        /* OYUNU HAFİF KARARTAN VE ALTIN IŞIK VEREN ARKA PLAN */
        #screen-overlay {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.8) 100%);
            opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            display: flex; align-items: center; justify-content: center;
        }
        #screen-overlay.show { opacity: 1; }

        /* MERKEZİ ANİMASYON KUTUSU */
        #winner-container {
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform: scale(0.5); opacity: 0;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        #screen-overlay.show #winner-container {
            transform: scale(1); opacity: 1;
        }

        /* ARKADAKİ ALTIN RENGİ DEV PARLAMA */
        .bg-glow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, transparent 60%);
            z-index: -2; animation: pulseGlow 3s infinite alternate;
        }

        /* ÜST YAZI: MATCH WINNER */
        .win-title {
            font-size: 5rem; font-weight: 900; text-transform: uppercase;
            letter-spacing: 15px; margin-bottom: 20px;
            background: linear-gradient(to bottom, #fef08a 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            background-clip: text; /* Sarı uyarıyı önleyen standart ekleme */
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(245, 158, 11, 0.5));
            text-align: center;
            opacity: 0; transform: translateY(-30px); transition: all 1s 0.3s ease;
        }
        #screen-overlay.show .win-title { opacity: 1; transform: translateY(0); }

        /* LOGO VE SARMAŞIKLARIN OLDUĞU ALAN */
        .hero-section {
            display: flex; align-items: center; justify-content: center; gap: 20px;
            position: relative;
        }

        /* ALTIN SARMAŞIKLAR (LAUREL WREATH) */
        .wreath {
            width: 250px; height: 400px;
            opacity: 0; filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.6));
            transition: all 1.2s 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .wreath-left { transform: translateX(-50px) scale(0.8); }
        .wreath-right { transform: translateX(50px) scale(0.8) scaleX(-1); }
        
        #screen-overlay.show .wreath-left { opacity: 1; transform: translateX(0) scale(1); }
        #screen-overlay.show .wreath-right { opacity: 1; transform: translateX(0) scale(1) scaleX(-1); }

        /* LOGO ÇERÇEVESİ */
        .logo-box {
            width: 320px; height: 320px; background: rgba(0, 0, 0, 0.8);
            border: 5px solid #fbbf24; border-radius: 50%;
            box-shadow: 0 0 60px rgba(245, 158, 11, 0.8), inset 0 0 30px rgba(245, 158, 11, 0.4);
            display: flex; align-items: center; justify-content: center; 
            -webkit-backdrop-filter: blur(12px); /* Safari uyumluluğu için */
            backdrop-filter: blur(12px); 
            padding: 30px; box-sizing: border-box;
            position: relative; z-index: 5;
        }
        .logo-box img { 
            max-width: 100%; max-height: 100%; object-fit: contain; 
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3)); 
        }

        /* TAKIM İSMİ KUTUSU */
        .team-name-wrapper {
            margin-top: -30px; z-index: 15;
            opacity: 0; transform: translateY(30px); transition: all 1s 0.7s ease;
        }
        #screen-overlay.show .team-name-wrapper { opacity: 1; transform: translateY(0); }

        .team-name {
            font-size: 4rem; font-weight: 900; color: #fff; text-transform: uppercase;
            letter-spacing: 8px; text-shadow: 0 5px 15px rgba(0,0,0,0.9);
            background: linear-gradient(90deg, transparent 0%, rgba(245, 158, 11, 0.8) 50%, transparent 100%);
            padding: 10px 100px;
            border-bottom: 4px solid #fcd34d;
            border-top: 2px solid rgba(245, 158, 11, 0.5);
        }

        /* UÇUŞAN KIVILCIMLAR/PARÇACIKLAR */
        .particles {
            position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        }
        .particle {
            position: absolute; bottom: -10%; width: 6px; height: 6px;
            background: #fde047; border-radius: 50%;
            box-shadow: 0 0 10px #f59e0b, 0 0 20px #f59e0b;
            animation: floatUp linear infinite;
        }

        @keyframes pulseGlow { 
            from { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; } 
            to { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-1000px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    
    <div id="screen-overlay">
        <!-- Arka Plan Kıvılcımları -->
        <div class="particles" id="particle-box"></div>

        <div id="winner-container">
            <div class="bg-glow"></div>
            
            <div class="win-title">MATCH WINNER</div>
            
            <div class="hero-section">
                <!-- SOL ALTIN SARMAŞIK -->
                <svg class="wreath wreath-left" viewBox="0 0 200 400" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#fde047" />
                            <stop offset="50%" stop-color="#f59e0b" />
                            <stop offset="100%" stop-color="#b45309" />
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <path d="M 180 380 Q 50 300 20 150 Q 20 80 100 20" fill="none" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>
                    <path d="M 150 350 Q 80 340 100 280 Q 140 280 150 350" fill="url(#gold)" filter="url(#glow)"/>
                    <path d="M 110 270 Q 40 240 60 180 Q 100 190 110 270" fill="url(#gold)" filter="url(#glow)"/>
                    <path d="M 70 180 Q 10 140 40 80 Q 80 100 70 180" fill="url(#gold)" filter="url(#glow)"/>
                    <path d="M 50 90 Q 20 40 80 10 Q 90 60 50 90" fill="url(#gold)" filter="url(#glow)"/>
                </svg>

                <!-- MERKEZ LOGO -->
                <div class="logo-box" id="winLogoBox"></div>

                <!-- SAĞ ALTIN SARMAŞIK -->
                <svg class="wreath wreath-right" viewBox="0 0 200 400" preserveAspectRatio="xMidYMid meet">
                    <path d="M 180 380 Q 50 300 20 150 Q 20 80 100 20" fill="none" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>
                    <path d="M 150 350 Q 80 340 100 280 Q 140 280 150 350" fill="url(#gold)" filter="url(#glow)"/>
                    <path d="M 110 270 Q 40 240 60 180 Q 100 190 110 270" fill="url(#gold)" filter="url(#glow)"/>
                    <path d="M 70 180 Q 10 140 40 80 Q 80 100 70 180" fill="url(#gold)" filter="url(#glow)"/>
                    <path d="M 50 90 Q 20 40 80 10 Q 90 60 50 90" fill="url(#gold)" filter="url(#glow)"/>
                </svg>
            </div>

            <!-- TAKIM İSMİ -->
            <div class="team-name-wrapper">
                <div class="team-name" id="winTeamName">TEAM NAME</div>
            </div>
        </div>
    </div>

    <script>
        const socket = window.io(); // window ibaresi editördeki tanımsız io hatasını engeller
        let hideTimeout;

        // Uçuşan Altın Parçacıklarını (Kıvılcımları) Oluştur
        const particleBox = document.getElementById('particle-box');
        for(let i=0; i<30; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 3 + 2) + 's';
            p.style.animationDelay = Math.random() * 2 + 's';
            particleBox.appendChild(p);
        }

        // Admin Panelden '🏆 Win' Butonuna Basıldığında Tetiklenir
        socket.on('showWinner', (data) => {
            const overlay = document.getElementById('screen-overlay');
            document.getElementById('winTeamName').innerText = data.team;
            
            // Eğer logo varsa göster, yoksa dev kupa ikonu koy
            document.getElementById('winLogoBox').innerHTML = data.logo 
                ? `<img src="${data.logo}">` 
                : `<span style="font-size:8rem; color:#fff; filter:drop-shadow(0 0 20px rgba(245,158,11,0.8));">🏆</span>`;
            
            // Ekranda belirme Animasyonlarını Başlat
            overlay.classList.remove('show');
            
            setTimeout(() => {
                overlay.classList.add('show');
                
                // 12 saniye ekranda durduktan sonra otomatik kapanır
                if(hideTimeout) clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => { 
                    overlay.classList.remove('show'); 
                }, 12000); 
            }, 100);
        });
    </script>
</body>
</html>
